services:
  app:
    image: vontainment/v-serpbear:latest
    restart: unless-stopped
    container_name: serpbear
    shm_size: "1024MB"
    network_mode: bridge
    ports:
      - "3030:3000"
    # Values come from .env (optional) and from the shell. Anything set in .env or the shell wins over the
    # defaults below. SECRET and APIKEY have no defaults here; the operator must set each to a unique value.
    env_file:
      - path: ./.env
        required: false
    environment:
      # --- Authentication and security ---
      - SECRET=${SECRET:-}
      - APIKEY=${APIKEY:-}
      - SESSION_DURATION=${SESSION_DURATION:-24}
      # Number of reverse proxies in front of the app (see README). Unset means 0, the socket address is used.
      - TRUST_PROXY=${TRUST_PROXY:-0}

      # --- App URLs ---
      # Public URL used for OAuth redirects and email links. Set this to your real deployment URL in .env.
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Optional. Internal origin the cron worker uses to call the app (for example http://localhost:3000 when the
      # public URL is not reachable from inside the container). When empty, NEXT_PUBLIC_APP_URL is used.
      - APP_URL=${APP_URL:-}

      # --- Interface and branding ---
      # Thum.io thumbnail capture; false disables those requests. Read at request time, no rebuild needed.
      - SCREENSHOTS=${SCREENSHOTS:-true}
      - NEXT_PUBLIC_WHITE_LABEL=${NEXT_PUBLIC_WHITE_LABEL:-false}
      # File name (stored in /app/data) for the white-label logo. Recommended dimensions: 96x96 pixels.
      - WHITE_LABEL_LOGO_FILE=${WHITE_LABEL_LOGO_FILE:-branding-logo.png}
      - NEXT_PUBLIC_PLATFORM_NAME=${NEXT_PUBLIC_PLATFORM_NAME:-SerpBear}

      # --- Scheduling ---
      - CRON_TIMEZONE=${CRON_TIMEZONE:-America/New_York}
      - TZ=${CRON_TIMEZONE:-America/New_York}
      - CRON_MAIN_SCHEDULE=${CRON_MAIN_SCHEDULE:-00:00}
      - CRON_FAILED_SCHEDULE=${CRON_FAILED_SCHEDULE:-hourly}
      - CRON_EMAIL_SCHEDULE=${CRON_EMAIL_SCHEDULE:-06:00}

      # --- Scraping and performance ---
      - REFRESH_QUEUE_CONCURRENCY=${REFRESH_QUEUE_CONCURRENCY:-3}
      - PARALLEL_SCRAPE_CONCURRENCY=${PARALLEL_SCRAPE_CONCURRENCY:-3}
      # Optional. Free Serper API key used to turn google.com/goto result links into real URLs (serper.dev).
      - SERPER_API_KEY=${SERPER_API_KEY:-}

      # --- Google integrations ---
      - SEARCH_CONSOLE_CLIENT_EMAIL=${SEARCH_CONSOLE_CLIENT_EMAIL:-}
      - SEARCH_CONSOLE_PRIVATE_KEY=${SEARCH_CONSOLE_PRIVATE_KEY:-}
    volumes:
      - data:/app/data

volumes:
  data:
