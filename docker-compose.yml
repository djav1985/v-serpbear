version: "3.8"

services:
  app:
    #image: towfiqi/serpbear:latest
    image: vontainment/v-serpbear:latest
    restart: unless-stopped
    container_name: serpbear
    shm_size: "1024MB"
    network_mode: bridge
    ports:
      - "3030:3000"
    # Values come from .env (optional) and from the shell. Compose fails fast if SECRET or APIKEY is unset.
    env_file:
      - path: ./.env
        required: false
    environment:
      - SECRET=${SECRET:?set SECRET in .env or the shell}
      - APIKEY=${APIKEY:?set APIKEY in .env or the shell}
      - SESSION_DURATION=24
      # Thum.io thumbnail capture; false disables those requests. Read at request time, no rebuild needed.
      # SCREENSHOTS is the preferred name and takes precedence over NEXT_PUBLIC_SCREENSHOTS.
      - NEXT_PUBLIC_SCREENSHOTS=true
      - NEXT_PUBLIC_WHITE_LABEL=false
      # File name (stored in /app/data) for the white-label logo. Recommended dimensions: 96x96 pixels.
      - WHITE_LABEL_LOGO_FILE=branding-logo.png
      - NEXT_PUBLIC_PLATFORM_NAME=SerpBear
      - SEARCH_CONSOLE_CLIENT_EMAIL=
      - SEARCH_CONSOLE_PRIVATE_KEY=--
      - NEXT_PUBLIC_APP_URL=https://serp.hugev.xyz
      - CRON_TIMEZONE=${CRON_TIMEZONE:-America/New_York}
      - TZ=${CRON_TIMEZONE:-America/New_York}
      - CRON_MAIN_SCHEDULE=${CRON_MAIN_SCHEDULE:-0 0 0 * * *}
      - CRON_FAILED_SCHEDULE=${CRON_FAILED_SCHEDULE:-0 0 */1 * * *}
      - CRON_EMAIL_SCHEDULE=${CRON_EMAIL_SCHEDULE:-0 0 6 * * *}
      - REFRESH_QUEUE_CONCURRENCY=${REFRESH_QUEUE_CONCURRENCY:-3}
      - PARALLEL_SCRAPE_CONCURRENCY=${PARALLEL_SCRAPE_CONCURRENCY:-3}
    volumes:
      - data:/app/data

volumes:
  data:
